<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haptix dApp Simulator — EIP-6963 &amp; Web3 Testing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --bg-deep: #050508;
      --bg-surface: #090A0F;
      --bg-card: rgba(14, 16, 23, 0.85);
      --text-white: #FFFFFF;
      --text-body: #E2E8F0;
      --text-muted: #8E9BAE;
      --base-blue: #0052FF;
      --base-blue-hover: #0045D8;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.18);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-heading: 'Outfit', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #080A0F;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 82, 255, 0.12) 0%, transparent 65%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
      color: var(--text-body);
      font-family: var(--font-main);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 16px;
      font-family: var(--font-mono);
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-white);
      letter-spacing: -0.02em;
    }

    p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    button {
      background: #FFFFFF;
      color: #000000;
      border: 1px solid transparent;
      padding: 13px 18px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-main);
    }

    button:hover {
      background: #E2E8F0;
      transform: translateY(-1px);
    }

    button.sec {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border-color: var(--border-light);
    }

    button.sec:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-focus);
    }

    .output-box {
      background: #000000;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: #93C5FD;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 220px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-pill" id="statusPill">Checking Provider...</div>
    <h1>Haptix dApp Simulator</h1>
    <p>Simulates Uniswap/Aave dApp calling <code>window.ethereum</code> methods to trigger Haptix biometric passkey signatures.</p>

    <div class="btn-group">
      <button id="btnConnect">
        <span>1. Connect Haptix Wallet</span>
        <span style="font-family:var(--font-mono);font-size:12px;">eth_requestAccounts →</span>
      </button>
      <button class="sec" id="btnSmallTx" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;">
          <img src="assets/eth_logo.svg" width="13" height="19" alt="ETH" />
          <span>2. Send Small ETH (0.001 ETH)</span>
        </span>
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--accent-emerald);">1-Sig Touch ID →</span>
      </button>
      <button class="sec" id="btnUsdcTx" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;">
          <img src="assets/usdc_logo.svg" width="18" height="18" alt="USDC" style="border-radius:50%;" />
          <span>3. Send $20.00 USDC (Autonomous Agent)</span>
        </span>
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--accent-emerald);">0x01 Agent Sig →</span>
      </button>
      <button class="sec" id="btnLargeTx" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;">
          <img src="assets/eth_logo.svg" width="13" height="19" alt="ETH" />
          <span>4. Send Large Transfer (0.05 ETH)</span>
        </span>
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--accent-amber);">2-of-2 Quorum →</span>
      </button>
      <button class="sec" id="btnCeilingTx" style="border-color:rgba(244,63,94,0.3);color:#FDA4AF;display:flex;align-items:center;justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;">
          <img src="assets/usdc_logo.svg" width="18" height="18" alt="USDC" style="border-radius:50%;" />
          <span>5. Over Ceiling Transfer ($350 USDC)</span>
        </span>
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--accent-rose);">Policy Block ✕</span>
      </button>
      <button class="sec" id="btnSign">
        <span>6. Sign In Message (ERC-1271)</span>
        <span style="font-family:var(--font-mono);font-size:12px;">personal_sign →</span>
      </button>
    </div>

    <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;">RPC Output Console</div>
    <div class="output-box" id="outputConsole">Provider ready. Click Connect to start.</div>
  </div>

  <script>
    let activeProvider = null;
    const discoveredWallets = new Map();

    const log = (msg) => {
      document.getElementById('outputConsole').textContent = typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg;
    };

    function updateStatus() {
      const p = getProvider();
      const pill = document.getElementById('statusPill');
      if (p) {
        if (p.isPasskey || p === window.passkey) {
          pill.style.background = 'rgba(16, 185, 129, 0.1)';
          pill.style.color = '#10B981';
          pill.style.borderColor = 'rgba(16, 185, 129, 0.3)';
          pill.textContent = 'Passkey Smart Wallet Active (Direct / EIP-6963)';
        } else {
          pill.style.background = 'rgba(245, 158, 11, 0.1)';
          pill.style.color = '#F59E0B';
          pill.style.borderColor = 'rgba(245, 158, 11, 0.3)';
          pill.textContent = 'Generic Wallet Injected (Passkey Fallback Available)';
        }
      } else {
        pill.textContent = 'Extension Not Detected Yet';
      }
    }

    function getProvider() {
      if (activeProvider) return activeProvider;
      if (window.passkey) return window.passkey;
      if (window.passkeyProvider) return window.passkeyProvider;
      if (window.ethereum?.isPasskey) return window.ethereum;
      if (window.ethereum?.providers) {
        const pk = window.ethereum.providers.find(p => p.isPasskey);
        if (pk) return pk;
      }
      return window.ethereum;
    }

    // EIP-6963 Multi-Wallet Discovery Listener
    window.addEventListener('eip6963:announceProvider', (event) => {
      const { info, provider } = event.detail;
      discoveredWallets.set(info.rdns, { info, provider });
      if (info.name === 'Passkey Smart Wallet' || info.rdns === 'io.passkey.wallet' || provider.isPasskey) {
        activeProvider = provider;
        updateStatus();
      }
    });

    // Request EIP-6963 providers
    window.dispatchEvent(new CustomEvent('eip6963:requestProvider'));

    window.addEventListener('load', () => {
      setTimeout(updateStatus, 100);
      setTimeout(updateStatus, 500);
    });

    document.getElementById('btnConnect').onclick = async () => {
      const p = getProvider();
      if (!p) {
        log({ error: 'No Web3 provider found. Make sure Passkey Smart Wallet extension is installed & enabled.' });
        return;
      }
      try {
        log('Calling eth_requestAccounts on Passkey Wallet...');
        const accounts = await p.request({ method: 'eth_requestAccounts' });
        const chainId = await p.request({ method: 'eth_chainId' });
        log({
          provider: (p.isPasskey || p === window.passkey) ? 'Passkey Smart Wallet' : 'Generic',
          connectedAccount: accounts[0],
          chainId: chainId,
          network: 'Base Sepolia (84532)'
        });
      } catch (e) {
        log({ error: e.message });
      }
    };

    document.getElementById('btnSmallTx').onclick = async () => {
      const p = getProvider();
      if (!p) {
        log({ error: 'No provider available' });
        return;
      }
      try {
        log('Requesting sub-threshold transfer (0.001 ETH)...');
        const txHash = await p.request({
          method: 'eth_sendTransaction',
          params: [{
            to: '0x22db962929afe98d0269De0BAa6c442A3Aa6913D',
            value: '0x38d7ea4c68000', // 0.001 ETH
            data: '0x'
          }]
        });
        log({ status: 'Success (1-Sig Authorized)', userOpHash: txHash });
      } catch (e) {
        log({ error: e.message });
      }
    };

    document.getElementById('btnUsdcTx').onclick = async () => {
      const p = getProvider();
      if (!p) {
        log({ error: 'No provider available' });
        return;
      }
      try {
        log('Requesting Autonomous Agent Transfer ($20.00 USDC)...');
        const usdcAddr = '0x036CbD53842c5426634e7929541eC2318f3dCF7e';
        const recipient = '0x22db962929afe98d0269De0BAa6c442A3Aa6913D';
        const transferCalldata = '0xa9059cbb' +
          recipient.slice(2).padStart(64, '0') +
          (20000000).toString(16).padStart(64, '0'); // 20 USDC

        const txHash = await p.request({
          method: 'eth_sendTransaction',
          params: [{
            to: usdcAddr,
            value: '0x0',
            data: transferCalldata
          }]
        });
        log({ status: 'Success (Autonomous Agent 0x01 Signed)', userOpHash: txHash, amount: '20.00 USDC' });
      } catch (e) {
        log({ error: e.message });
      }
    };

    document.getElementById('btnCeilingTx').onclick = async () => {
      const p = getProvider();
      if (!p) {
        log({ error: 'No provider available' });
        return;
      }
      try {
        log('Attempting Over-Ceiling Transfer ($350.00 USDC - exceeds $200.00 Ceiling)...');
        const usdcAddr = '0x036CbD53842c5426634e7929541eC2318f3dCF7e';
        const recipient = '0x22db962929afe98d0269De0BAa6c442A3Aa6913D';
        const transferCalldata = '0xa9059cbb' +
          recipient.slice(2).padStart(64, '0') +
          (350000000).toString(16).padStart(64, '0'); // 350 USDC

        const txHash = await p.request({
          method: 'eth_sendTransaction',
          params: [{
            to: usdcAddr,
            value: '0x0',
            data: transferCalldata
          }]
        });
        log({ status: 'Blocked by SpendPolicy Firewall', response: txHash });
      } catch (e) {
        log({ status: 'Strict Policy Block (Fail-Closed)', error: e.message });
      }
    };

    document.getElementById('btnLargeTx').onclick = async () => {
      const p = getProvider();
      if (!p) {
        log({ error: 'No provider available' });
        return;
      }
      try {
        log('Requesting large transfer (0.05 ETH - exceeds 0.01 limit)...');
        const txHash = await p.request({
          method: 'eth_sendTransaction',
          params: [{
            to: '0x22db962929afe98d0269De0BAa6c442A3Aa6913D',
            value: '0xb1a2bc2ec50000', // 0.05 ETH
            data: '0x'
          }]
        });
        log({ status: 'Success (2-of-2 Quorum Approved)', userOpHash: txHash });
      } catch (e) {
        log({ error: e.message });
      }
    };

    document.getElementById('btnSign').onclick = async () => {
      const p = getProvider();
      if (!p) {
        log({ error: 'No provider available' });
        return;
      }
      try {
        log('Requesting ERC-1271 off-chain sign-in message...');
        const sig = await p.request({
          method: 'personal_sign',
          params: ['Sign in to Passkey dApp at ' + new Date().toISOString(), p.selectedAddress || '0x34Aeb3A39fd1838D1C897F879EAB0a258507802c']
        });
        log({ status: 'Signature Generated (Passkey ERC-1271)', signature: sig });
      } catch (e) {
        log({ error: e.message });
      }
    };

  </script>
</body>
</html>
