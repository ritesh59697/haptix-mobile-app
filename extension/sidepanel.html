<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passkey Smart Wallet — Side Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --bg-deep: #050508;
      --bg-surface: #090A0F;
      --bg-card: rgba(14, 16, 23, 0.9);
      --bg-subtle: rgba(255, 255, 255, 0.04);
      --text-title: #FFFFFF;
      --text-body: #E2E8F0;
      --text-muted: #8E9BAE;
      --text-dark: #525E70;

      --base-blue: #0052FF;
      --base-blue-hover: #0045D8;
      --base-blue-light: rgba(0, 82, 255, 0.18);
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;

      --border-light: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.18);
      --border-blue: rgba(0, 82, 255, 0.35);

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      --font-heading: 'Outfit', sans-serif;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-black);
      color: var(--text-body);
      font-family: var(--font-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 12px;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .balance-val {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      color: var(--text-title);
    }

    .asset-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid var(--border-light);
      padding-top: 10px;
    }

    .asset-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .btn {
      background: #FFFFFF;
      color: #000000;
      border: none;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #E2E8F0; }

    .btn-freeze {
      background: var(--accent-rose);
      color: #FFF;
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="panel-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg, #0052FF, #8B5CF6);display:flex;align-items:center;justify-content:center;color:#FFF;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/></svg>
      </div>
      <span class="brand-title">Passkey Wallet</span>
    </div>
    <span style="font-size:11px;font-weight:700;color:var(--accent-emerald);font-family:var(--font-mono);">Base Sepolia</span>
  </div>

  <div class="card">
    <div class="card-title">Total Portfolio</div>
    <div class="balance-val" id="spTotalEth">0.0003 ETH</div>
    <div class="asset-list">
      <div class="asset-item">
        <span style="color:var(--text-white);font-weight:600;">Native ETH</span>
        <span style="font-family:var(--font-mono);color:var(--text-muted);" id="spEthVal">0.0003 ETH</span>
      </div>
      <div class="asset-item">
        <span style="color:var(--text-white);font-weight:600;">USDC Coin</span>
        <span style="font-family:var(--font-mono);color:var(--text-muted);" id="spUsdcVal">0.00 USDC</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Policy Firewall</div>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;">
      <div style="display:flex;justify-content:space-between;">
        <span style="color:var(--text-muted);">Threshold:</span>
        <strong style="color:#60A5FA;font-family:var(--font-mono);">&lt; 0.010 ETH</strong>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <span style="color:var(--text-muted);">Address Book:</span>
        <strong style="color:var(--accent-emerald);font-family:var(--font-mono);">Active</strong>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <span style="color:var(--text-muted);">Approval Lock:</span>
        <strong style="color:var(--accent-amber);font-family:var(--font-mono);">2-of-2 Quorum</strong>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;margin-top:auto;">
    <button class="btn-freeze" id="spPanicFreezeBtn">Emergency Freeze (1-Sig)</button>
    <a href="/web/app.html" target="_blank" class="btn">Open Full Web Dashboard ↗</a>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
